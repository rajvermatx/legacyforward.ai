<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380">
  <!-- Background -->
  <rect width="900" height="380" fill="#f8fafc" rx="12"/>

  <!-- Title -->
  <text x="450" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a" font-family="Space Grotesk, sans-serif" letter-spacing="0.3">LLM vs. LCM — ARCHITECTURAL COMPARISON</text>
  <text x="450" y="52" text-anchor="middle" font-size="11" fill="#64748b" font-family="Nunito, sans-serif">Same transformer foundation — different representational unit, different capabilities</text>

  <!-- ── LLM Column ── -->
  <rect x="32" y="64" width="400" height="296" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="32" y="64" width="400" height="38" rx="10" fill="#3b82f6"/>
  <rect x="32" y="88" width="400" height="14" rx="0" fill="#3b82f6"/>
  <text x="232" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff" font-family="Space Grotesk, sans-serif">LARGE LANGUAGE MODEL (LLM)</text>

  <!-- LLM rows -->
  <!-- Row: Input -->
  <rect x="42" y="114" width="380" height="46" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="52" y="132" font-size="9" font-weight="700" fill="#1d4ed8" font-family="Space Grotesk, sans-serif" letter-spacing="1">INPUT UNIT</text>
  <text x="52" y="148" font-size="10" fill="#1e40af" font-family="Nunito, sans-serif">Token (subword fragment) — 650–700 tokens per 500 words</text>

  <!-- Row: Representation -->
  <rect x="42" y="166" width="380" height="46" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="52" y="184" font-size="9" font-weight="700" fill="#1d4ed8" font-family="Space Grotesk, sans-serif" letter-spacing="1">REPRESENTATION</text>
  <text x="52" y="200" font-size="10" fill="#1e40af" font-family="Nunito, sans-serif">Token embedding — language-specific, context-free</text>

  <!-- Row: Attention -->
  <rect x="42" y="218" width="380" height="46" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="52" y="236" font-size="9" font-weight="700" fill="#1d4ed8" font-family="Space Grotesk, sans-serif" letter-spacing="1">ATTENTION BASIS</text>
  <text x="52" y="252" font-size="10" fill="#1e40af" font-family="Nunito, sans-serif">Token proximity + position — degrades at distance</text>

  <!-- Row: Cross-lingual -->
  <rect x="42" y="270" width="380" height="46" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="52" y="288" font-size="9" font-weight="700" fill="#b91c1c" font-family="Space Grotesk, sans-serif" letter-spacing="1">CROSS-LINGUAL</text>
  <text x="52" y="304" font-size="10" fill="#991b1b" font-family="Nunito, sans-serif">Requires translation or multilingual fine-tuning</text>

  <!-- Row: Global coherence -->
  <rect x="42" y="322" width="380" height="30" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="52" y="336" font-size="9" font-weight="700" fill="#b91c1c" font-family="Space Grotesk, sans-serif" letter-spacing="1">GLOBAL COHERENCE</text>
  <text x="52" y="348" font-size="10" fill="#991b1b" font-family="Nunito, sans-serif">Degrades with sequence length — lost in the middle</text>

  <!-- ── LCM Column ── -->
  <rect x="468" y="64" width="400" height="296" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="468" y="64" width="400" height="38" rx="10" fill="#a855f7"/>
  <rect x="468" y="88" width="400" height="14" rx="0" fill="#a855f7"/>
  <text x="668" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff" font-family="Space Grotesk, sans-serif">LARGE CONCEPT MODEL (LCM)</text>

  <!-- LCM rows -->
  <rect x="478" y="114" width="380" height="46" rx="6" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
  <text x="488" y="132" font-size="9" font-weight="700" fill="#6d28d9" font-family="Space Grotesk, sans-serif" letter-spacing="1">INPUT UNIT</text>
  <text x="488" y="148" font-size="10" fill="#5b21b6" font-family="Nunito, sans-serif">Sentence (concept embedding) — 25–35 embeddings per 500 words</text>

  <rect x="478" y="166" width="380" height="46" rx="6" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
  <text x="488" y="184" font-size="9" font-weight="700" fill="#6d28d9" font-family="Space Grotesk, sans-serif" letter-spacing="1">REPRESENTATION</text>
  <text x="488" y="200" font-size="10" fill="#5b21b6" font-family="Nunito, sans-serif">SONAR embedding — language-agnostic, 1,024 dimensions</text>

  <rect x="478" y="218" width="380" height="46" rx="6" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
  <text x="488" y="236" font-size="9" font-weight="700" fill="#6d28d9" font-family="Space Grotesk, sans-serif" letter-spacing="1">ATTENTION BASIS</text>
  <text x="488" y="252" font-size="10" fill="#5b21b6" font-family="Nunito, sans-serif">Semantic similarity in concept space — position-agnostic</text>

  <rect x="478" y="270" width="380" height="46" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="488" y="288" font-size="9" font-weight="700" fill="#166534" font-family="Space Grotesk, sans-serif" letter-spacing="1">CROSS-LINGUAL</text>
  <text x="488" y="304" font-size="10" fill="#14532d" font-family="Nunito, sans-serif">Native — shared concept space across 200 languages</text>

  <rect x="478" y="322" width="380" height="30" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="488" y="336" font-size="9" font-weight="700" fill="#166534" font-family="Space Grotesk, sans-serif" letter-spacing="1">GLOBAL COHERENCE</text>
  <text x="488" y="348" font-size="10" fill="#14532d" font-family="Nunito, sans-serif">Maintained — semantic attention is not position-biased</text>

  <!-- VS badge -->
  <circle cx="450" cy="212" r="22" fill="#0f172a"/>
  <text x="450" y="216" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" font-family="Space Grotesk, sans-serif">VS</text>
</svg>
